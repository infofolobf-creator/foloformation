name: Agent Prospect Automation

on:
  workflow_dispatch:
    inputs:
      sector:
        description: 'Secteur (coaching, formation, etc.)'
        required: true
        default: 'coaching et formation'
      location:
        description: 'Localisation (Burkina Faso, etc.)'
        required: true
        default: 'Burkina Faso'
      limit:
        description: 'Nombre de prospects à rechercher'
        required: true
        default: '10'

jobs:
  agent-prospect:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Groq Agent
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GMAIL_EMAIL: infofolo.bf@gmail.com
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        SECTOR: ${{ github.event.inputs.sector }}
        LOCATION: ${{ github.event.inputs.location }}
        LIMIT: ${{ github.event.inputs.limit }}
      run: python agent_groq.py
    
    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add prospects.csv emails_log.json
        git commit -m "Agent: Prospects et emails du 2026-04-19 13:10:57" || true
        git push
